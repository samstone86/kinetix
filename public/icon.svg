<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hexRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="hexInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131C31" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="cyanPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="roseWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="45%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="emeraldWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Android Adaptive / Google Play compliant background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />

  <!-- Subtle synth-grid horizon lines -->
  <g stroke="#1E293B" stroke-width="2" opacity="0.55">
    <line x1="64" y1="160" x2="448" y2="160" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="352" x2="448" y2="352" />
    <line x1="160" y1="64" x2="160" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="352" y1="64" x2="352" y2="448" />
  </g>

  <!-- Isometric Hexagonal Arcade Shield (Strictly within Android 66/108 Safe Zone) -->
  <polygon
    points="256,96 394,176 394,336 256,416 118,336 118,176"
    fill="url(#hexInner)"
    stroke="url(#hexRim)"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <polygon
    points="256,114 378,185 378,327 256,398 134,327 134,185"
    fill="none"
    stroke="#38BDF8"
    stroke-opacity="0.22"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Sculpted 3D "K" Kinetix Prism Monogram -->
  <!-- Left Vertical Cyan Prism Pillar -->
  <rect x="176" y="164" width="42" height="184" rx="12" fill="url(#cyanPillar)" />

  <!-- Upper-Right Rose Laser Wing -->
  <path
    d="M230 246 L296 170 C304 161 318 161 327 169 C336 177 336 191 328 200 L262 274 Z"
    fill="url(#roseWing)"
  />

  <!-- Lower-Right Emerald Vector Wing -->
  <path
    d="M226 254 L262 238 L328 312 C336 321 336 335 327 343 C318 351 304 351 296 342 Z"
    fill="url(#emeraldWing)"
  />

  <!-- Floating Amber Arcade Energy Core Diamond -->
  <polygon
    points="336,232 360,256 336,280 312,256"
    fill="url(#amberCore)"
  />
</svg>
